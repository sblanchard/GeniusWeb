# GeniusWeb — Docker Compose
#
# UDP device discovery (AntennaGenius / PowerGenius / TunerGenius)
# broadcasts on the LAN, so the service runs with `network_mode: host`.
# Docker's default bridge drops broadcast packets. Host mode binds
# directly to the host's network stack and exposes the app on
# http://<host>:9050 — no `ports:` mapping needed.
#
# Linux only. On macOS / Windows Docker Desktop, host mode isn't fully
# supported. Use a `macvlan` network or configure explicit device IPs
# in the Settings page (no discovery).
#
# This repo bundles the four FlexRadio Genius client libraries as git
# submodules under vendor/. Clone with:
#     git clone --recurse-submodules <repo>
# or, after a normal clone:
#     git submodule update --init --recursive

services:
  geniusweb:
    image: geniusweb:latest
    container_name: geniusweb
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./data-protection-keys:/root/.aspnet/DataProtection-Keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:9050
      - ConnectionStrings__Default=Data Source=/data/geniusweb.db
    # The aspnet image has neither wget nor curl, so a check using them can only ever fail, and
    # autoheal then restarts a healthy panel for good. Bash ships in the image.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9050 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    labels:
      autoheal: "true"
